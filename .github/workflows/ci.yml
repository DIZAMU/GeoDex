name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: .github/scripts/test-commit-message.sh
      - name: No attribution lines in this pull request's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-commit-messages.sh "$BASE" "$HEAD"

  e2e:
    name: End-to-end (${{ matrix.project }} ${{ matrix.shard }}/2)
    # Private repos have a limited free-minutes allowance, so browsers only run on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # The runner has one test worker, and the whole suite takes longer than one job may run,
    # so it is split by screen size and then in halves. The slow map tests sort into the first
    # halves: those take about 13 minutes, the second halves about 5.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
        shard: [1, 2]
    # The steps below have their own limits; this one is the safety net around them.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is sometimes very slow on a runner (15 minutes instead of 15
      # seconds), so the browser is cached per Playwright version and only fetched on a miss.
      # The system libraries it needs still come from apt on every run.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        timeout-minutes: 10
      # Setup has its own limit above, so a slow download fails as setup, not as tests.
      - run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        timeout-minutes: 20
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
