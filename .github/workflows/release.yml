name: Release

# Merging releases/<tag>.md into main publishes that release: the workflow creates the tag
# on the merge commit and the GitHub Release with the file's notes. Releases that already
# exist are left alone, so re-runs are safe.
on:
  push:
    branches: [main]
    paths: ["releases/v*.md", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      # GitHub cannot order tags like phase-10.2 against phase-9, so they become semantic
      # versions: phase-N is v0.N.0 and phase-N.M is v0.N.M (DECISIONS.md 040). This token
      # may not create tags on older commits (their workflow files differ from main's), so
      # the author pushes the v0 tags once (releases/README.md); this step then moves each
      # release onto its new tag and removes the old one. It never fails the job.
      - name: Move releases onto version tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^phase-[0-9]+(\.[0-9]+)?$' || true); do
            num="${old#phase-}"
            major="${num%%.*}"
            minor="0"
            if [ "$num" != "$major" ]; then minor="${num#*.}"; fi
            new="v0.${major}.${minor}"
            if ! git rev-parse -q --verify "refs/tags/${new}" >/dev/null; then
              echo "::notice::$old stays until the $new tag is pushed"
              continue
            fi
            if gh release edit "$old" --tag "$new"; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${old}" || echo "::warning::could not delete tag $old"
              echo "moved $old to $new"
            else
              echo "::warning::could not move $old to $new"
            fi
          done
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in releases/v*.md; do
            tag="$(basename "$notes" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag exists"
              continue
            fi
            # A release still under its old phase tag is not published twice.
            version="${tag#v0.}"
            major="${version%%.*}"
            minor="${version#*.}"
            legacy="phase-${major}"
            if [ "$minor" != "0" ]; then legacy="phase-${major}.${minor}"; fi
            if gh release view "$legacy" >/dev/null 2>&1; then
              echo "$tag is still published as $legacy"
              continue
            fi
            title="$(head -n 1 "$notes" | sed 's/^# //')"
            tail -n +3 "$notes" > body.md
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file body.md
            echo "published $tag"
          done
