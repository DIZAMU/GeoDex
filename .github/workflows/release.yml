name: Release

# Merging releases/<tag>.md into main publishes that release: the workflow creates the tag
# on the merge commit and the GitHub Release with the file's notes. Releases that already
# exist are left alone, so re-runs are safe.
on:
  push:
    branches: [main]
    paths: ["releases/phase-*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in releases/phase-*.md; do
            tag="$(basename "$notes" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag exists"
              continue
            fi
            title="$(head -n 1 "$notes" | sed 's/^# //')"
            tail -n +3 "$notes" > body.md
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file body.md
            echo "published $tag"
          done
