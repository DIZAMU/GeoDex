<!doctype html>
<html lang="en" data-theme="atlas">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E2433" />
    <meta name="description" content="Spaced-repetition geography trainer" />
    <meta property="og:title" content="GeoDex" />
    <meta property="og:description" content="Spaced-repetition geography trainer" />
    <meta property="og:image" content="https://geodex.dilovanzm.workers.dev/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoDex</title>
    <script>
      // Applies the stored theme before first paint. Mirrors src/themes/apply.ts.
      (() => {
        var preference = "atlas";
        try {
          preference = localStorage.getItem("geodex.theme") || preference;
        } catch {}
        if (["atlas", "minimal", "playful", "auto"].indexOf(preference) < 0) preference = "atlas";
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var root = document.documentElement;
        root.dataset.theme = preference === "auto" ? (dark ? "atlas" : "minimal") : preference;
        root.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
